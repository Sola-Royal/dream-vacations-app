services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [dv-net]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      COUNTRIES_API_BASE_URL: https://api.restcountries.com/countries/v5
      COUNTRIES_API_KEY: ${COUNTRIES_API_KEY}
    depends_on: [db]
    ports:
      - "${BACKEND_PORT}:5000"
    networks: [dv-net]
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:5000
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${FRONTEND_PORT}:80"
    networks: [dv-net]
networks:
  dv-net:
volumes:
  pgdata:
