name: CD
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dv-backend:latest
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          build-args: |
            REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dv-frontend:latest
